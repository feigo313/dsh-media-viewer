# dsh-media-preview bundle patch
#
# This file is the `dsh.bundle.patch` layer of the package: when the plugin is
# installed through the official CLI —
#
#   dsh plugin --profile <name> add dsh-media-preview
#
# — the command reconciles `dsh.profile.bundles` against installed packages
# and, seeing this declaration, appends `dsh-media-preview` to the bundle
# stack. The profile boot then merges THIS patch (a single `insert` of the
# plugin row) exactly like a manual cordis.patch.yml mount line. The entry
# `name` must equal the package name so the client-modules scan resolves the
# package's ./client bundle and serves it at /plugins/dsh-media-preview/client.js.
- insert:
    - id: media-preview
      name: 'dsh-media-preview'
